<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Параллакса</title>
    <style>
        /* 1. Основные стили страницы (Нейтральный фон) */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f3f4f6; /* Светло-серый нейтральный фон */
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px; /* Легкая сетка для текстуры */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Скрываем полосы прокрутки */
        }

        /* 2. Контейнер для перспективы (чтобы 3D работало) */
        .container {
            perspective: 1000px;
            text-align: center;
        }

        /* 3. Сама карточка с изображением */
        .parallax-card {
            width: 300px;
            height: 400px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            
            /* Важно: сохраняем 3D пространство для дочерних элементов */
            transform-style: preserve-3d; 
            
            /* Картинка (заглушка с красивым градиентом или фото) */
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            
            /* Плавность движения */
            transition: transform 0.1s ease-out;
            cursor: pointer;
            margin-bottom: 30px;
        }

        /* Эффект блика поверх картинки */
        .parallax-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 100%);
            opacity: 0.8;
            transform: translateZ(20px); /* Блик чуть ближе к зрителю */
        }

        /* 4. Стили текста */
        h1 {
            font-size: 1.5rem;
            color: #374151;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
            margin-top: 20px;
        }

        /* Анимация появления текста */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="parallax-card" id="card"></div>
        
        <h1>Удачный запуск теста</h1>
    </div>

    <script>
        const card = document.getElementById('card');
        const container = document.querySelector('.container');

        // Слушаем движение мыши по всему окну
        document.addEventListener('mousemove', (e) => {
            // Получаем ширину и высоту окна
            const width = window.innerWidth;
            const height = window.innerHeight;

            // Вычисляем положение мыши относительно центра (от -1 до 1)
            const xVal = (e.pageX - width / 2) / width;
            const yVal = (e.pageY - height / 2) / height;

            // Настраиваем силу эффекта (чем больше число, тем сильнее наклон)
            const rotateY = xVal * 30; // Поворот по оси Y зависит от движения по X
            const rotateX = yVal * -30; // Поворот по оси X зависит от движения по Y (инвертировано)

            // Применяем трансформацию
            card.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;
        });

        // (Опционально) Возвращаем карточку в центр, когда мышь уходит за пределы
        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            card.style.transition = 'transform 0.5s ease';
        });
        
        // Возвращаем быстрый отклик при возвращении мыши
        document.addEventListener('mouseenter', () => {
             card.style.transition = 'transform 0.1s ease-out';
        });

    </script>
</body>
</html>
