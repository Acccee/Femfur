<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Femfur - Anonymous Imageboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Femfur</h1>
            <nav>
                <button class="nav-btn" data-view="home">Home</button>
                <button class="nav-btn" data-view="boards">Boards</button>
                <span id="auth-section">
                    <button class="nav-btn" data-view="login">Login</button>
                    <button class="nav-btn" data-view="register">Register</button>
                </span>
                <span id="user-section" style="display:none;">
                    <span id="username-display"></span>
                    <button class="nav-btn" id="btn-logout">Logout</button>
                </span>
            </nav>
        </div>
    </header>

    <main class="container">
        <div id="message-container"></div>

        <div id="view-home" class="view">
            <h2>Welcome to Femfur</h2>
            <p>An anonymous imageboard. No email required.</p>
            <button id="btn-create-category" class="action-btn">Create Category</button>
            <div id="categories-list"></div>
        </div>

        <div id="view-category" class="view" style="display:none;">
            <div id="category-header"></div>
            <button id="btn-create-board" class="action-btn">Create Board</button>
            <div id="boards-list"></div>
        </div>

        <div id="view-board" class="view" style="display:none;">
            <div id="board-header"></div>
            <button id="btn-create-thread" class="action-btn">Create Thread</button>
            <div id="threads-list"></div>
        </div>

        <div id="view-thread" class="view" style="display:none;">
            <div id="thread-header"></div>
            <div id="thread-posts"></div>
            <div id="reply-form">
                <h3>Reply</h3>
                <textarea id="reply-content" placeholder="Your reply..." rows="5"></textarea>
                <button id="btn-submit-reply" class="action-btn">Submit</button>
            </div>
        </div>

        <div id="view-login" class="view" style="display:none;">
            <h2>Login</h2>
            <form id="form-login">
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit" class="action-btn">Login</button>
            </form>
        </div>

        <div id="view-register" class="view" style="display:none;">
            <h2>Register</h2>
            <form id="form-register">
                <input type="text" id="register-username" placeholder="Username" required>
                <input type="password" id="register-password" placeholder="Password" required>
                <button type="submit" class="action-btn">Register</button>
            </form>
        </div>
    </main>

    <div id="modal-create-category" class="modal">
        <div class="modal-content">
            <span class="close" data-modal="modal-create-category">&times;</span>
            <h3>Create Category</h3>
            <input type="text" id="input-category-name" placeholder="Category name">
            <button id="btn-submit-category" class="action-btn">Create</button>
        </div>
    </div>

    <div id="modal-create-board" class="modal">
        <div class="modal-content">
            <span class="close" data-modal="modal-create-board">&times;</span>
            <h3>Create Board</h3>
            <input type="text" id="input-board-name" placeholder="Board name">
            <input type="text" id="input-board-code" placeholder="Board code (e.g., /fur/)">
            <textarea id="input-board-desc" placeholder="Description"></textarea>
            <button id="btn-submit-board" class="action-btn">Create</button>
        </div>
    </div>

    <div id="modal-create-thread" class="modal">
        <div class="modal-content">
            <span class="close" data-modal="modal-create-thread">&times;</span>
            <h3>Create Thread</h3>
            <input type="text" id="input-thread-title" placeholder="Thread title">
            <textarea id="input-thread-content" placeholder="Thread content"></textarea>
            <button id="btn-submit-thread" class="action-btn">Create</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js"></script>
</body>
</html>
