<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Femfur - Image Board</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grain-overlay"></div>
    
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🍀</span>
                <h1 class="logo-text">Femfur</h1>
            </div>
            <nav class="nav" id="mainNav">
                <a href="#" class="nav-link" data-page="home">Home</a>
                <a href="#" class="nav-link" data-page="boards">Boards</a>
                <a href="#" class="nav-link" data-page="register">Register</a>
                <a href="#" class="nav-link" data-page="login">Login</a>
                <a href="#" class="nav-link user-info" id="userInfo" style="display: none;"></a>
                <button class="nav-link logout-btn" id="logoutBtn" style="display: none;">Logout</button>
            </nav>
        </div>
    </header>

    <main class="main-content" id="mainContent">
        <!-- Content will be dynamically loaded here -->
    </main>

    <footer class="footer">
        <p>Femfur © 2026 - All rights reserved</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="boards.js"></script>
    <script src="threads.js"></script>
    <script src="app.js"></script>
</body>
</html>
