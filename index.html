<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой футуристичный сайт</title>
    <style>
        /* 1. Глобальные стили и Плавная прокрутка */
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f12;
            color: white;
            overflow-x: hidden;
        }

        /* 2. Кастомный курсор */
        #cursor {
            width: 20px;
            height: 20px;
            border: 2px solid #00d4ff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
        }

        /* 3. Стеклянный эффект (Glassmorphism) для Навигации */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover { color: #00d4ff; }

        /* 4. Параллакс Секция (Герой-блок) */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #0f0f12, #1a1a2e);
            position: relative;
            overflow: hidden;
        }

        .hero h1 {
            font-size: 5rem;
            z-index: 2;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        /* Элемент для параллакса при движении мыши */
        .parallax-bg {
            position: absolute;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(0,212,255,0.1) 0%, transparent 70%);
            z-index: 1;
        }

        /* 5. Карточки с эффектом наклона (Tilt Effect) */
        .content {
            padding: 100px 20px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .card {
            width: 300px;
            height: 400px;
            background: #1e1e26;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: transform 0.2s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* Градиентный блик при наведении */
        .card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        /* 6. Анимация появления при скролле */
        .reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: 1s all ease;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>
<body>

    <div id="cursor"></div>

    <nav>
        <a href="#">Главная</a>
        <a href="#about">Проекты</a>
        <a href="#">Контакты</a>
    </nav>

    <section class="hero">
        <div class="parallax-bg" id="parallax"></div>
        <h1 class="reveal">HELLO WORLD</h1>
    </section>

    <section class="content" id="about">
        <div class="card reveal" onmousemove="tilt(event, this)" onmouseleave="resetTilt(this)">Card 1</div>
        <div class="card reveal" onmousemove="tilt(event, this)" onmouseleave="resetTilt(this)">Card 2</div>
        <div class="card reveal" onmousemove="tilt(event, this)" onmouseleave="resetTilt(this)">Card 3</div>
    </section>

    <script>
        // 1. Кастомный курсор
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // 2. Параллакс эффект для фона
        document.addEventListener('mousemove', (e) => {
            const bg = document.getElementById('parallax');
            const x = (window.innerWidth - e.pageX * 2) / 50;
            const y = (window.innerHeight - e.pageY * 2) / 50;
            bg.style.transform = `translateX(${x}px) translateY(${y}px)`;
        });

        // 3. Эффект наклона карточек (3D Tilt)
        function tilt(e, element) {
            const rect = element.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = (y - centerY) / 10;
            const rotateY = (centerX - x) / 10;
            
            element.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
        }

        function resetTilt(element) {
            element.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
        }

        // 4. Reveal - появление элементов при скролле
        window.addEventListener('scroll', () => {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(el => {
                const windowHeight = window.innerHeight;
                const revealTop = el.getBoundingClientRect().top;
                if (revealTop < windowHeight - 100) {
                    el.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
