<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ˢᵉˢˡᵃ</title>
    <link rel="icon" type="image/png" href="seslalogo.png">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0a0a0a; /* Чистый нейтральный темный фон */
            overflow: hidden;
            perspective: 1000px;
        }

        #logo {
            max-width: 80vw;
            max-height: 80vh;
            /* Убираем все лишние фильтры и наложения */
            display: block;
            user-select: none;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }
    </style>
</head>
<body>

    <img src="seslalogo.png" alt="ˢᵉˢˡᵃ" id="logo">

    <script>
        const logo = document.getElementById('logo');
        const sensitivity = 20; // Настрой под себя (чем больше число, тем слабее наклон)

        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / sensitivity;
            const y = (window.innerHeight / 2 - e.pageY) / sensitivity;

            // Инвертируем X и Y для естественного слежения
            logo.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
        });

        // Возврат в центр
        document.addEventListener('mouseleave', () => {
            logo.style.transition = "transform 0.8s ease";
            logo.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        document.addEventListener('mouseenter', () => {
            logo.style.transition = "transform 0.1s ease-out";
        });
    </script>
</body>
</html>
