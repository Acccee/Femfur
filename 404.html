<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>404 — Page not found</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --bg: #16223f;
    --accent: #da415b;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
}

/* PAGE APPEAR */
.page {
    opacity: 0;
    transform: translateY(16px);
    animation: pageIn 0.8s ease forwards;
}

@keyframes pageIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.container {
    text-align: center;
    padding: 24px;
}

/* IMAGE */
.image-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 28px;
    animation: float 5s ease-in-out infinite;
    will-change: transform;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.image-wrap img {
    display: block;
    max-width: 420px;
    max-height: 55vh;
    width: auto;
    height: auto;
}

/* SKELETON PLACEHOLDER */
.image-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: linear-gradient(
        100deg,
        rgba(218,65,91,0.08) 30%,
        rgba(218,65,91,0.18) 40%,
        rgba(218,65,91,0.08) 50%
    );
    background-size: 200% 100%;
    animation: skeleton 1.4s linear infinite;
    z-index: -1;
}

@keyframes skeleton {
    to {
        background-position-x: -200%;
    }
}

/* BUTTON */
.back-button {
    display: inline-block;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    color: var(--bg);
    background: var(--accent);
    border-radius: 999px;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.back-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(218, 65, 91, 0.35);
}

.back-button:active {
    transform: translateY(0);
    box-shadow: 0 6px 14px rgba(218, 65, 91, 0.25);
}
</style>
</head>

<body>
<div class="page" id="parallax">
    <div class="container">
        <div class="image-wrap">
            <img src="404.png" alt="404 — Page not found">
        </div>

        <a class="back-button" href="https://femfur.space">
            Back to home
        </a>
    </div>
</div>

<script>
const parallax = document.getElementById('parallax');

document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 10;
    const y = (e.clientY / window.innerHeight - 0.5) * 10;

    parallax.style.transform = `translate(${x}px, ${y}px)`;
});
</script>
</body>
</html>
