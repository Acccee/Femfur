<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>404</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --bg: #16223f;
    --accent: #da415b;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: system-ui, sans-serif;
    overflow: hidden;
}

/* PAGE FADE */
.page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 0.7s ease forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

/* IMAGE AREA */
.image-wrap {
    position: relative;
    margin-bottom: 80px;
    will-change: transform;
}

/* FLOAT */
.image {
    animation: float 5s ease-in-out infinite;
    display: block;
    max-width: 360px;
    max-height: 50vh;
    width: auto;
    height: auto;
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* SKELETON (STRICT) */
.skeleton {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: linear-gradient(
        90deg,
        rgba(218,65,91,0.08) 25%,
        rgba(218,65,91,0.18) 37%,
        rgba(218,65,91,0.08) 63%
    );
    background-size: 200% 100%;
    animation: skeleton 1.4s linear infinite;
}

@keyframes skeleton {
    to { background-position-x: -200%; }
}

/* BUTTON */
.button-wrap {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
}

.back-button {
    padding: 14px 36px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--bg);
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease;
}

.back-button:hover {
    transform: translateY(-2px);
}

.back-button:active {
    transform: translateY(1px) scale(0.98);
}
</style>
</head>

<body>
<div class="page">

    <div class="image-wrap" id="parallax">
        <div class="skeleton" id="skeleton"></div>
        <img
            src="404.png"
            alt="404"
            class="image"
            onload="document.getElementById('skeleton').style.display='none'"
        >
    </div>

    <div class="button-wrap">
        <a class="back-button" href="https://femfur.space">
            Back to home
        </a>
    </div>

</div>

<script>
const target = document.getElementById('parallax');

document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 18;
    const y = (e.clientY / window.innerHeight - 0.5) * 18;

    target.style.transform = `translate(${x}px, ${y}px)`;
});
</script>
</body>
</html>
