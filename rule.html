<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Femfur.space Rules</title>
    <link rel="icon" type="image/png" href="assets/fav.png">
    <link rel="shortcut icon" type="image/png" href="assets/fav.png">
    <link rel="apple-touch-icon" href="assets/fav.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #ff3b47;
            --text-color: #e2e8f0;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .lang-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .lang-switcher select {
            padding: 10px 15px;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-switcher select:hover {
            background-color: rgba(255, 59, 71, 0.1);
        }

        .container {
            display: flex;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            gap: 40px;
        }

        .image-side {
            flex: 1;
            position: sticky;
            top: 40px;
            height: fit-content;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .image-side img {
            max-width: 100%;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 59, 71, 0.2);
            animation: float 6s ease-in-out infinite;
        }

        .content-side {
            flex: 1.5;
        }

        h1 {
            color: var(--accent-color);
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .intro {
            font-size: 1.1rem;
            margin-bottom: 40px;
            padding: 20px;
            border-left: 4px solid var(--accent-color);
            background: var(--card-bg);
        }

        section {
            margin-bottom: 30px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease;
            opacity: 0;
            transform: translateY(30px);
        }

        section.visible {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        section:hover {
            border-color: var(--accent-color);
            transform: scale(1.02);
        }

        h2 {
            color: var(--accent-color);
            margin-bottom: 15px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
        }

        h2::before {
            content: "•";
            margin-right: 10px;
        }

        p, li {
            margin-bottom: 10px;
            font-weight: 300;
        }

        ul {
            list-style: none;
            padding-left: 20px;
        }

        ul li::before {
            content: "▸";
            color: var(--accent-color);
            display: inline-block;
            width: 1em;
            margin-left: -1em;
        }

        .highlight {
            color: var(--accent-color);
            font-weight: bold;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .image-side {
                position: relative;
                top: 0;
            }
            .lang-switcher {
                position: absolute;
                top: 10px;
                right: 10px;
            }
            h1 { font-size: 2rem; }
        }

        /* RTL Support for Arabic */
        html[lang="ar"] {
            direction: rtl;
        }

        html[lang="ar"] .intro {
            border-left: none;
            border-right: 4px solid var(--accent-color);
        }

        html[lang="ar"] h2::before {
            margin-right: 0;
            margin-left: 10px;
        }

        html[lang="ar"] ul {
            padding-left: 0;
            padding-right: 20px;
        }

        html[lang="ar"] ul li::before {
            margin-left: 0;
            margin-right: -1em;
        }

        html[lang="ar"] .lang-switcher {
            right: auto;
            left: 20px;
        }
    </style>
</head>
<body>

<div class="lang-switcher">
    <select id="langSelect">
        <option value="en">English</option>
        <option value="ru">Русский</option>
        <option value="uk">Українська</option>
        <option value="ja">日本語</option>
        <option value="es">Español</option>
        <option value="ar">العربية</option>
    </select>
</div>

<div class="container">
    <div class="image-side">
        <img src="rule.png" alt="Femfur Rules Mascot">
    </div>

    <div class="content-side" id="content">
        <!-- Content will be loaded dynamically -->
    </div>
</div>

<script src="locales/rule-translations.js"></script>
<script>
    function renderContent(lang) {
        const t = window.ruleTranslations[lang] || window.ruleTranslations.en;
        document.documentElement.lang = lang;
        document.title = t.pageTitle;
        document.getElementById('page-title').textContent = t.title;
        
        const content = document.getElementById('content');
        content.innerHTML = `
            <h1>${t.heading}</h1>
            <div class="intro">
                ${t.intro}
            </div>

            <section>
                <h2>${t.rule1_title}</h2>
                <p>${t.rule1_1}</p>
                <p>${t.rule1_2}</p>
                <p>${t.rule1_3}</p>
                <p>${t.rule1_4}</p>
            </section>

            <section>
                <h2>${t.rule2_title}</h2>
                <p>${t.rule2_1}</p>
                <p>${t.rule2_2}</p>
                <p>${t.rule2_3}</p>
                <p>${t.rule2_4}</p>
                <p>${t.rule2_5}</p>
            </section>

            <section>
                <h2>${t.rule3_title}</h2>
                <p>${t.rule3_1}</p>
                <p>${t.rule3_2}</p>
                <p>${t.rule3_3}</p>
                <p>${t.rule3_4}</p>
            </section>

            <section>
                <h2>${t.rule4_title}</h2>
                <p class="highlight">${t.rule4_subtitle}</p>
                <ul>
                    <li>${t.rule4_1}</li>
                    <li>${t.rule4_2}</li>
                    <li>${t.rule4_3}</li>
                    <li>${t.rule4_4}</li>
                    <li>${t.rule4_5}</li>
                    <li>${t.rule4_6}</li>
                    <li>${t.rule4_7}</li>
                    <li>${t.rule4_8}</li>
                </ul>
            </section>

            <section>
                <h2>${t.rule5_title}</h2>
                <p>${t.rule5_1}</p>
                <p>${t.rule5_2}</p>
                <p>${t.rule5_3}</p>
                <p>${t.rule5_4}</p>
                <p>${t.rule5_5}</p>
            </section>

            <section>
                <h2>${t.rule6_title}</h2>
                <p>${t.rule6_1}</p>
                <p>${t.rule6_2}</p>
                <p>${t.rule6_3}</p>
                <p>${t.rule6_4}</p>
            </section>

            <section>
                <h2>${t.rule7_title}</h2>
                <p>${t.rule7_1}</p>
                <p>${t.rule7_2}</p>
                <p>${t.rule7_3}</p>
                <p>${t.rule7_4}</p>
            </section>

            <section>
                <h2>${t.rule8_title}</h2>
                <p>${t.rule8_1}</p>
                <p>${t.rule8_2}</p>
                <p>${t.rule8_3}</p>
                <p>${t.rule8_4}</p>
            </section>

            <section>
                <h2>${t.rule9_title}</h2>
                <p>${t.rule9_1}</p>
                <p>${t.rule9_2}</p>
                <p>${t.rule9_3}</p>
                <p>${t.rule9_4}</p>
            </section>

            <section>
                <h2>${t.rule10_title}</h2>
                <p>${t.rule10_1}</p>
                <p>${t.rule10_2}</p>
                <p>${t.rule10_3}</p>
                <p>${t.rule10_4}</p>
            </section>

            <section>
                <h2>${t.rule11_title}</h2>
                <p>${t.rule11_1}</p>
                <p>${t.rule11_2}</p>
                <p>${t.rule11_3}</p>
            </section>
        `;

        // Trigger animation
        setTimeout(() => {
            document.querySelectorAll('section').forEach((section, index) => {
                setTimeout(() => {
                    section.classList.add('visible');
                }, index * 100);
            });
        }, 100);
    }

    // Language switcher
    const langSelect = document.getElementById('langSelect');
    const savedLang = localStorage.getItem('rules_language') || 'en';
    langSelect.value = savedLang;
    renderContent(savedLang);

    langSelect.addEventListener('change', (e) => {
        const newLang = e.target.value;
        localStorage.setItem('rules_language', newLang);
        renderContent(newLang);
    });
</script>

</body>
</html>
