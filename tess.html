<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tess AI — Femfur (GitHub Pages)</title>
  <style>
    /* --- Минималистичные стили, похожие на чат --- */
    :root{
      --bg:#071025; --card:#0b1220; --muted:#98a0b0; --accent1:#7c3aed; --accent2:#ec4899;
      --panel:#0f1724; --bubble-user: linear-gradient(90deg,var(--accent1),var(--accent2));
    }
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,system-ui,-apple-system,"Helvetica Neue",Arial;color:#e6eef8;background:linear-gradient(180deg,#021022,#071025);-webkit-font-smoothing:antialiased}
    .wrap{max-width:980px;margin:28px auto;padding:18px;}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.03)}
    header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.03)}
    .logo{display:flex;gap:12px;align-items:center}
    .logo .icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;background:linear-gradient(135deg,var(--accent1),var(--accent2))}
    .meta{font-size:13px}
    .controls{display:flex;gap:10px;align-items:center}
    .controls button{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer}
    .controls label{font-size:13px;color:var(--muted)}
    main.chat{height:62vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg, rgba(0,0,0,0.02), transparent)}
    .msg{max-width:78%;padding:12px;border-radius:10px;white-space:pre-wrap}
    .msg.assistant{background:rgba(255,255,255,0.03);align-self:flex-start;color:#e6eef8}
    .msg.user{background:var(--bubble-user);color:white;align-self:flex-end}
    .role{font-size:11px;color:var(--muted);margin-top:6px}
    footer{display:flex;gap:12px;padding:14px;border-top:1px solid rgba(255,255,255,0.03);align-items:flex-end}
    textarea{flex:1;min-height:70px;max-height:240px;padding:12px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.03);color:#e6eef8;resize:vertical}
    .col{display:flex;flex-direction:column;gap:8px}
    .send{background:linear-gradient(135deg,var(--accent1),var(--accent2));border:none;color:white;padding:10px 14px;border-radius:10px;cursor:pointer}
    .small{font-size:12px;color:var(--muted)}
    .hint{font-size:12px;color:var(--muted);padding:8px 16px}
    .center{display:flex;align-items:center;justify-content:center}
    a.link{color:#9fb2ff;font-size:13px}
    @media (max-width:720px){.wrap{margin:10px;padding:8px}.logo .meta{display:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="app">
      <header>
        <div class="logo">
          <div class="icon">T</div>
          <div>
            <div style="font-weight:700">Tess AI</div>
            <div class="meta">Кодовый ассистент — femfur.space</div>
          </div>
        </div>

        <div class="controls">
          <label class="small">Demo</label>
          <input id="demoToggle" type="checkbox" />
          <select id="persona" title="Persona">
            <option value="concise">Кратко</option>
            <option value="thorough">Подробно</option>
          </select>
          <button id="clearBtn" title="Очистить чат">Очистить</button>
        </div>
      </header>

      <main class="chat" id="chat"></main>

      <div class="hint center">
        <span class="small">API endpoint: <code id="apiUrl">(не задан)</code></span>
      </div>

      <footer>
        <textarea id="input" placeholder="Задай вопрос, вставь код или опиши ошибку..."></textarea>
        <div class="col" style="min-width:140px;">
          <button id="sendBtn" class="send">Отправить</button>
          <div class="small center"><a id="openConfig" class="link" href="config.json" target="_blank">config.json</a></div>
        </div>
      </footer>
    </div>

    <div style="margin-top:10px;color:var(--muted);font-size:13px">
      <b>Инструкция:</b> сайт работает в demo-режиме по умолчанию. Чтобы подключить реальную модель — задеплой backend и укажи его URL в <code>config.json</code>.
    </div>
  </div>

  <script>
  // -----------------------
  // Tess AI — static client
  // -----------------------
  (function(){
    const KEY = 'tess_ai_msgs_v1';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const demoToggle = document.getElementById('demoToggle');
    const personaEl = document.getElementById('persona');
    const clearBtn = document.getElementById('clearBtn');
    const apiUrlEl = document.getElementById('apiUrl');
    const openConfig = document.getElementById('openConfig');

    let config = { apiEndpoint: null, demoMode: true };
    // load config.json if present
    fetch('config.json', {cache: 'no-store'}).then(r=>{
      if (!r.ok) return;
      return r.json();
    }).then(j=>{
      if (!j) return;
      config = Object.assign(config, j);
      // if config explicitly sets DEMO false, reflect it
      if (typeof j.demoMode === 'boolean') demoToggle.checked = j.demoMode;
      updateApiLabel();
    }).catch(()=>{/*no config*/ updateApiLabel();});

    function updateApiLabel(){
      apiUrlEl.textContent = config.apiEndpoint ? config.apiEndpoint : '(не задан)';
      demoToggle.checked = !!config.demoMode;
    }

    // messages: first system message, then chat
    function loadMessages(){ try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : [{role:'system',content:'You are Tess AI — coding assistant. Answer concisely and show code when necessary.'}]; } catch(e) { return [{role:'system',content:'You are Tess AI — coding assistant.'}]; } }
    function saveMessages(ms){ localStorage.setItem(KEY, JSON.stringify(ms)); }

    let messages = loadMessages();

    function render(){
      chatEl.innerHTML = '';
      // skip system message in UI
      messages.slice(1).forEach(m=>{
        const d = document.createElement('div');
        d.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
        d.innerHTML = escapeHtml(m.content);
        chatEl.appendChild(d);
        const r = document.createElement('div'); r.className='role'; r.textContent = m.role;
        chatEl.appendChild(r);
      });
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function escapeHtml(s){
      // allow basic code blocks formatting (preserve)
      // We'll leave `\n` as-is; wrap in <pre> to keep monospace
      const isCode = s.includes('\\n') || s.includes('```');
      if (isCode) return '<pre style="margin:0;white-space:pre-wrap;font-family:monospace;font-size:13px;">'+htmlEncode(s)+'</pre>';
      return '<div style="white-space:pre-wrap;">'+htmlEncode(s)+'</div>';
    }
    function htmlEncode(t){return t.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}

    function append(role,content){
      messages.push({role,content});
      saveMessages(messages);
      render();
    }

    async function send(){
      const text = inputEl.value.trim();
      if (!text) return;
      append('user', text);
      inputEl.value = '';
      sendBtn.disabled = true;
      append('assistant', 'Tess AI печатает...');
      // remove the 'typing' placeholder immediately for nicer UX when replaced
      const typingIndex = messages.length-1;

      const currentDemo = demoToggle.checked;
      if (currentDemo || !config.apiEndpoint){
        // local demo reply (fast)
        await new Promise(r=>setTimeout(r, 600));
        messages.splice(typingIndex,1);
        const reply = demoReply(text, personaEl.value);
        append('assistant', reply);
        sendBtn.disabled = false;
        return;
      }

      // call external API
      try {
        const payload = { messages: messages.slice(-12), user_input: text, persona: personaEl.value };
        const resp = await fetch(config.apiEndpoint, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload),
        });
        messages.splice(typingIndex,1);
        if (!resp.ok){
          const txt = await resp.text();
          append('assistant', `Ошибка сервера: ${resp.status} — ${txt}`);
          sendBtn.disabled = false;
          return;
        }
        const data = await resp.json();
        append('assistant', data.reply || '(пустой ответ)');
      } catch (e){
        messages.splice(typingIndex,1);
        append('assistant', `Ошибка: ${e.message}`);
      }
      sendBtn.disabled = false;
    }

    function demoReply(text, persona){
      const low = text.toLowerCase();
      if (low.includes('ошибка') || low.includes('fix') || low.includes('исправь')) {
        return "Демо: проверь синтаксис. Пример:\n\nfunction example(){\n  try{\n    // ваш код\n  }catch(e){\n    console.error(e);\n  }\n}";
      }
      if (low.includes('оптимиз') || low.includes('optimi')) {
        return "Демо: оптимизация — кешируй результаты, избегай лишних аллокаций, профилируй горячие пути. Пришли код — покажу пример.";
      }
      return persona === 'concise' ? "Коротко: пришли пример кода и опиши проблему." : "Подробно: опиши окружение, шаги воспроизведения и вставь код. Я помогу пошагово.";
    }

    // events
    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', e=>{ if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send(); });
    clearBtn.addEventListener('click', ()=>{ if (!confirm('Очистить чат?')) return; messages = [{role:'system',content:messages[0]?.content||'You are Tess AI — coding assistant.'}]; saveMessages(messages); render(); });
    demoToggle.addEventListener('change', ()=>{ config.demoMode = demoToggle.checked; updateApiLabel(); });
    personaEl.addEventListener('change', ()=>{ /* no-op */ });

    // initial render
    updateApiLabel();
    render();

    // helper: if user clicks config.json link — open in new tab (already href)
    openConfig.addEventListener('click', ()=>{ /* user opens it manually */ });

  })();
  </script>
</body>
</html>
